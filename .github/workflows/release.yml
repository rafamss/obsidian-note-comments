name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write       # create the release and attach assets
  id-token: write       # required by attestation generation
  attestations: write   # record the provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Generate provenance attestation for assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release with assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Automatic release of \`$GITHUB_REF_NAME\` with provenance attestation." \
            main.js manifest.json styles.css
